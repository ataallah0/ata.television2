<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تلویزیون آنلاین - سریال مسافران</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #0a0a0a; color: #fff; font-family: Tahoma; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #1a1a1a; padding: 15px; text-align: center; border-bottom: 3px solid #e74c3c; font-size: 18px; font-weight: bold; }
        .main { display: flex; flex: 1; overflow: hidden; }
        
        /* لیست پخش سمت راست */
        .playlist { width: 320px; background: #111; overflow-y: auto; border-left: 1px solid #333; padding: 10px; }
        .ep-item { display: block; background: #222; color: #bbb; padding: 12px; margin-bottom: 8px; text-decoration: none; border-radius: 8px; font-size: 13px; transition: 0.3s; cursor: pointer; border-right: 4px solid transparent; }
        .ep-item:hover { background: #333; color: #fff; }
        .ep-item.active { background: #2c3e50; border-right: 4px solid #e74c3c; color: #fff; font-weight: bold; }

        /* بخش پلیر سمت چپ */
        .video-container { flex: 1; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        video { width: 100%; max-height: 100%; outline: none; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        @media (max-width: 768px) {
            .main { flex-direction: column; }
            .playlist { width: 100%; height: 250px; border-left: none; border-top: 1px solid #333; }
        }
    </style>
</head>
<body>

<header>📺 پخش کامل سریال مسافران (کیفیت اصلی)</header>

<div class="main">
    <div class="playlist" id="ep-list">
        </div>

    <div class="video-container">
        <video id="tv-player" controls autoplay poster="https://upko.ir/wp-content/uploads/2023/06/Mosaferan.jpg">
            <source id="video-source" src="" type="video/mp4">
            مرورگر شما از پخش ویدیو پشتیبانی نمی‌کند.
        </video>
    </div>
</div>

<script>
    const player = document.getElementById('tv-player');
    const source = document.getElementById('video-source');
    const listContainer = document.getElementById('ep-list');

    // تابع ساخت لینک‌ها بر اساس الگوی سایت آپکو
    function createPlaylist() {
        for (let i = 1; i <= 70; i++) {
            const epNum = i < 10 ? '0' + i : i;
            // لینک مستقیم کیفیت 480p از سرور آپکو
            const url = `https://dl.upko.ir/series/Mosaferan/Mosaferan.E${epNum}.480p.Upko.mp4`;
            
            const item = document.createElement('div');
            item.className = 'ep-item';
            item.id = 'ep-' + i;
            item.innerText = 'سریال مسافران - قسمت ' + i;
            item.onclick = () => play(url, i);
            listContainer.appendChild(item);
        }
    }

    function play(url, index) {
        source.src = url;
        player.load();
        player.play().catch(e => console.log("پخش خودکار مسدود شد، روی ویدیو کلیک کنید."));
        
        // تغییر وضعیت دکمه‌ها
        document.querySelectorAll('.ep-item').forEach(el => el.classList.remove('active'));
        document.getElementById('ep-' + index).classList.add('active');
        
        // ذخیره آخرین قسمت
        localStorage.setItem('last_watched', index);
    }

    // پخش خودکار قسمت بعدی وقتی این قسمت تمام شد
    player.onended = function() {
        let next = parseInt(localStorage.getItem('last_watched')) + 1;
        if (next <= 70) {
            const nextUrl = `https://dl.upko.ir/series/Mosaferan/Mosaferan.E${next < 10 ? '0' + next : next}.480p.Upko.mp4`;
            play(nextUrl, next);
        }
    };

    // اجرا در هنگام شروع سایت
    window.onload = () => {
        createPlaylist();
        let last = parseInt(localStorage.getItem('last_watched')) || 1;
        const lastUrl = `https://dl.upko.ir/series/Mosaferan/Mosaferan.E${last < 10 ? '0' + last : last}.480p.Upko.mp4`;
        play(lastUrl, last);
    };
</script>

</body>
</html>
