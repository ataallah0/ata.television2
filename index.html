<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تلویزیون سریال‌های کلاسیک</title>
    <style>
        body { background: #121212; color: white; font-family: Tahoma, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; }
        .tv-container { width: 95%; max-width: 850px; margin-top: 20px; border: 8px solid #333; border-radius: 15px; background: #000; overflow: hidden; box-shadow: 0 0 30px rgba(0,0,0,0.7); }
        .screen { position: relative; padding-bottom: 56.25%; height: 0; }
        .screen iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .info { background: #222; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-top: 2px solid #333; }
        h1 { font-size: 20px; color: #f1c40f; margin: 10px 0; }
        .btn { background: #27ae60; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn:hover { background: #2ecc71; transform: scale(1.05); }
        .badge { background: #e74c3c; padding: 5px 10px; border-radius: 5px; font-size: 12px; }
    </style>
</head>
<body>

    <h1>📺 کانال پخش ۲۴ ساعته سریال</h1>

    <div class="tv-container">
        <div class="screen">
            <iframe id="video-frame" src="" allowfullscreen="true" allow="autoplay"></iframe>
        </div>
        <div class="info">
            <div>
                <span class="badge" id="series-name">در حال بارگذاری...</span>
                <p id="ep-title" style="margin: 5px 0 0 0; font-size: 14px;">قسمت ...</p>
            </div>
            <button class="btn" onclick="nextVideo()">قسمت بعدی ⏭️</button>
        </div>
    </div>

    <script>
        // لیست قسمت‌ها - من برای هر سریال شروع را گذاشته‌ام
        // شما می‌توانید به راحتی قسمت‌های 3، 4 و غیره را به همین ترتیب اضافه کنید
        const tvPlaylist = [
            // سریال مسافران
            { title: "مسافران", ep: "قسمت 1", url: "https://www.namasha.com/embed/mlNwASkS" },
            { title: "مسافران", ep: "قسمت 2", url: "https://www.namasha.com/embed/S26XhW7T" },
            
            // سریال صلح‌بانان
            { title: "صلح‌بانان", ep: "قسمت 1", url: "https://www.namasha.com/embed/O8M7m9H6" },
            { title: "صلح‌بانان", ep: "قسمت 2", url: "https://www.namasha.com/embed/S90m7j5K" }, // لینک نمونه

            // سریال زنان کوچک
            { title: "زنان کوچک", ep: "قسمت 1", url: "https://www.namasha.com/embed/h32eZl1d" },
            { title: "زنان کوچک", ep: "قسمت 2", url: "https://www.namasha.com/embed/oK27J6mB" },

            // سریال لحظه گرگ و میش
            { title: "لحظه گرگ و میش", ep: "قسمت 1", url: "https://www.namasha.com/embed/7200788691" },
            { title: "لحظه گرگ و میش", ep: "قسمت 2", url: "https://www.namasha.com/embed/8100922345" } // لینک نمونه
        ];

        let currentIdx = 0;

        function playChannel(index) {
            if (index >= tvPlaylist.length) index = 0;
            currentIdx = index;
            
            const video = tvPlaylist[index];
            document.getElementById('video-frame').src = video.url;
            document.getElementById('series-name').innerText = video.title;
            document.getElementById('ep-title').innerText = video.ep;
            
            // ذخیره در حافظه برای مراجعات بعدی
            localStorage.setItem('tv_index', index);
        }

        function nextVideo() {
            currentIdx++;
            playChannel(currentIdx);
        }

        // اجرای خودکار هنگام باز شدن سایت
        window.onload = () => {
            const lastPos = localStorage.getItem('tv_index');
            playChannel(lastPos ? parseInt(lastPos) : 0);
        };
    </script>
</body>
</html>
