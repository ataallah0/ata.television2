<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تلویزیون اختصاصی - مسافران</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: contain; }
        #overlay { position: absolute; color: white; background: rgba(0,0,0,0.5); padding: 10px; top: 10px; right: 10px; font-family: Tahoma; border-radius: 5px; pointer-events: none; opacity: 0; transition: 0.5s; }
        body:hover #overlay { opacity: 1; }
    </style>
</head>
<body>

    <div id="overlay">در حال پخش: <span id="ep-name"></span></div>
    
    <video id="tv-engine" controls autoplay playsinline>
        <source id="video-src" src="" type="video/mp4">
    </video>

    <script>
        const video = document.getElementById('tv-engine');
        const source = document.getElementById('video-src');
        const label = document.getElementById('ep-name');

        // تنظیمات تلویزیون
        const TOTAL_EPISODES = 70;
        
        // ۱. خواندن وضعیت قبلی از حافظه مرورگر
        let currentEp = parseInt(localStorage.getItem('tv_current_ep')) || 1;
        let currentTime = parseFloat(localStorage.getItem('tv_current_time')) || 0;

        function loadVideo(epNum, startTime) {
            const formattedEp = epNum < 10 ? '0' + epNum : epNum;
            // لینک مستقیم از سرور آپکو (تست شده)
            const videoUrl = `https://dl.upko.ir/series/Mosaferan/Mosaferan.E${formattedEp}.480p.Upko.mp4`;
            
            source.src = videoUrl;
            label.innerText = "قسمت " + epNum;
            video.load();
            video.currentTime = startTime;
            
            // تلاش برای پخش خودکار (برخی مرورگرها اجازه نمی‌دهند و باید یک کلیک شود)
            video.play().catch(() => {
                console.log("لطفاً برای شروع پخش یک بار روی صفحه کلیک کنید.");
            });
        }

        // ۲. ذخیره لحظه‌ای وضعیت (هر ۵ ثانیه یکبار)
        video.ontimeupdate = () => {
            localStorage.setItem('tv_current_time', video.currentTime);
            localStorage.setItem('tv_current_ep', currentEp);
        };

        // ۳. جادوی تلویزیون: وقتی قسمت تمام شد، برو بعدی
        video.onended = () => {
            if (currentEp < TOTAL_EPISODES) {
                currentEp++;
                currentTime = 0;
                loadVideo(currentEp, 0);
            } else {
                currentEp = 1; // بازگشت به قسمت اول بعد از اتمام ۷۰ قسمت
                loadVideo(1, 0);
            }
        };

        // شروع به کار تلویزیون
        window.onload = () => {
            loadVideo(currentEp, currentTime);
        };
    </script>
</body>
</html>
