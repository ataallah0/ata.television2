<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تلویزیون اختصاصی</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: contain; cursor: pointer; }
        /* نمایش شماره قسمت در گوشه تصویر */
        #status { position: absolute; top: 20px; left: 20px; background: rgba(255,0,0,0.7); color: white; padding: 5px 15px; border-radius: 5px; font-family: Tahoma; font-size: 12px; z-index: 10; pointer-events: none; }
    </style>
</head>
<body>

    <div id="status">در حال پخش: قسمت <span id="ep-num">1</span></div>
    
    <video id="tv-player" controls autoplay playsinline>
        <source id="video-src" src="" type="video/mp4">
    </video>

    <script>
        const player = document.getElementById('tv-player');
        const source = document.getElementById('video-src');
        const epLabel = document.getElementById('ep-num');

        const TOTAL_EP = 70;

        // ۱. بازیابی وضعیت قبلی از حافظه مرورگر
        let currentEp = parseInt(localStorage.getItem('tv_ep')) || 1;
        let currentTime = parseFloat(localStorage.getItem('tv_time')) || 0;

        function startChannel(ep, time) {
            const formattedEp = ep < 10 ? '0' + ep : ep;
            // لینک مستقیم از سرور آپکو که با رفرر مخفی باز می‌شود
            const url = `https://dl.upko.ir/series/Mosaferan/Mosaferan.E${formattedEp}.480p.Upko.mp4`;
            
            source.src = url;
            epLabel.innerText = ep;
            player.load();
            player.currentTime = time;
            
            // شروع پخش
            player.play().catch(() => {
                console.log("مرورگر اجازه پخش خودکار نداد. کاربر باید یک بار کلیک کند.");
            });
        }

        // ۲. ذخیره مداوم ثانیه و قسمت
        player.ontimeupdate = () => {
            if (player.currentTime > 0) {
                localStorage.setItem('tv_time', player.currentTime);
                localStorage.setItem('tv_ep', currentEp);
            }
        };

        // ۳. پخش خودکار قسمت بعدی (بدون دخالت کاربر)
        player.onended = () => {
            if (currentEp < TOTAL_EP) {
                currentEp++;
                localStorage.setItem('tv_ep', currentEp);
                localStorage.setItem('tv_time', 0);
                startChannel(currentEp, 0);
            } else {
                currentEp = 1; // شروع مجدد از قسمت اول
                startChannel(1, 0);
            }
        };

        // لود اولیه تلویزیون
        window.onload = () => startChannel(currentEp, currentTime);
    </script>
</body>
</html>
