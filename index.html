<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تلویزیون مسافران | عطاالله</title>
    <style>
        body { background: #000; color: #fff; margin: 0; font-family: Tahoma; overflow: hidden; text-align: center; }
        #header { background: #1a1a1a; padding: 10px; border-bottom: 3px solid #e50914; }
        .player-container { height: calc(100vh - 70px); background: #000; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        #info-bar { position: absolute; bottom: 25px; width: 100%; pointer-events: none; }
        .tag { background: rgba(0,0,0,0.85); color: #f1c40f; padding: 10px 25px; border-radius: 30px; border: 1px solid #f1c40f; font-size: 14px; }
    </style>
</head>
<body>

    <div id="header">
        <h3 style="margin:0; color: #e50914;">📺 شبکه اختصاصی مسافران</h3>
    </div>

    <div class="player-container">
        <div id="video-slot" style="height: 100%;"></div>
        <div id="info-bar">
            <div id="current-title" class="tag">در حال هماهنگی با فرستنده...</div>
        </div>
    </div>

    <script>
        // آیدی‌های استخراج شده از نماشا
        const playlist = [
            { id: 'O73Y7HwV', title: 'مسافران - قسمت ۱' },
            { id: 'p0iX6uL8', title: 'مسافران - قسمت ۲' },
            { id: 'kKLkFysT', title: 'مسافران - قسمت ۳۷' },
            { id: 'm9V2b6rX', title: 'مسافران - قسمت ۴' }
        ];

        const epochStart = new Date('2025-01-01T00:00:00').getTime() / 1000;
        const duration = 2100; // هر قسمت ۳۵ دقیقه

        function sync() {
            const now = Math.floor(Date.now() / 1000);
            const totalCycle = playlist.length * duration;
            const elapsed = (now - epochStart) % totalCycle;
            
            const index = Math.floor(elapsed / duration);
            const currentItem = playlist[index];
            
            const container = document.getElementById('video-slot');
            // نماشا فعلاً پارامتر زمان شروع (vt) را مثل آپارات ندارد، 
            // پس ویدیو از اول قسمت پخش می‌شود تا هماهنگ بماند.
            const embedUrl = `https://www.namasha.com/embed/${currentItem.id}`;
            
            if (container.getAttribute('data-id') !== currentItem.id) {
                container.innerHTML = `<iframe src="${embedUrl}" allowFullScreen="true"></iframe>`;
                container.setAttribute('data-id', currentItem.id);
                document.getElementById('current-title').innerText = "در حال پخش: " + currentItem.title;
            }
        }

        sync();
        setInterval(sync, 30000); // چک کردن هر ۳۰ ثانیه
    </script>
</body>
</html>
