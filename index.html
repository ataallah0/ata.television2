<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پخش کامل سریال مسافران - ۷۰ قسمت</title>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #0d0d0d; color: #eee; font-family: Tahoma, sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1a1a1a; padding: 12px; text-align: center; border-bottom: 3px solid #ff3e3e; }
        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        /* لیست سمت راست با قابلیت اسکرول */
        .playlist-section { flex: 1; background: #151515; overflow-y: scroll; border-left: 1px solid #333; padding: 10px; }
        .series-label { background: #ff3e3e; color: white; padding: 8px; font-size: 14px; border-radius: 4px; margin-bottom: 10px; text-align: center; position: sticky; top: 0; }
        .episode-link { display: block; background: #222; color: #ccc; padding: 10px; margin-bottom: 5px; text-decoration: none; border-radius: 5px; font-size: 12px; transition: 0.2s; }
        .episode-link:hover { background: #333; color: #fff; }
        .episode-link.active { background: #444; border-right: 4px solid #ff3e3e; color: #ff3e3e; }

        /* بخش پلیر */
        .video-section { flex: 3; background: #000; position: relative; }
        video { width: 100%; height: 100%; outline: none; }
        
        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .playlist-section { height: 200px; flex: none; }
        }
    </style>
</head>
<body>

<header>
    <h2 style="margin:0; font-size: 16px;">📺 آرشیو کامل سریال مسافران (۷۰ قسمت)</h2>
</header>

<div class="main-container">
    <div class="playlist-section" id="playlist">
        <div class="series-label">انتخاب قسمت (۱ تا ۷۰)</div>
        <div id="links-container"></div>
    </div>

    <div class="video-section">
        <video id="main-player" controls>
            <source id="video-source" src="https://dl.porefilm.com/Series/Mosaferan/480/Mosaferan.E01.480p.PoreFilm.mp4" type="video/mp4">
        </video>
    </div>
</div>

<script>
    const container = document.getElementById('links-container');
    const totalEpisodes = 70;

    // ایجاد خودکار لینک برای ۷۰ قسمت
    for (let i = 1; i <= totalEpisodes; i++) {
        const epNumber = i < 10 ? '0' + i : i; // تبدیل ۱ به ۰۱ برای لینک درست
        const url = `https://dl.porefilm.com/Series/Mosaferan/480/Mosaferan.E${epNumber}.480p.PoreFilm.mp4`;
        
        const a = document.createElement('a');
        a.href = "#";
        a.className = 'episode-link' + (i === 1 ? ' active' : '');
        a.innerText = 'مسافران - قسمت ' + i;
        a.onclick = function(e) {
            e.preventDefault();
            changeVideo(url, i, this);
        };
        container.appendChild(a);
    }

    function changeVideo(url, num, el) {
        const player = document.getElementById('main-player');
        const source = document.getElementById('video-source');
        
        source.src = url;
        player.load();
        player.play();
        
        const links = document.querySelectorAll('.episode-link');
        links.forEach(l => l.classList.remove('active'));
        el.classList.add('active');
    }
</script>

</body>
</html>
