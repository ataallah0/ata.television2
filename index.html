<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تلویزیون آنلاین عطاالله</title>
    <style>
        body { background: #000; color: #fff; margin: 0; font-family: Tahoma; overflow: hidden; text-align: center; }
        #header { background: #1a1a1a; padding: 10px; border-bottom: 3px solid #e50914; }
        .player-container { height: calc(100vh - 80px); background: #000; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        #info-bar { position: absolute; bottom: 20px; width: 100%; pointer-events: none; }
        .status-tag { background: rgba(0,0,0,0.8); color: #f1c40f; padding: 10px 20px; border-radius: 20px; border: 1px solid #f1c40f; font-size: 14px; }
    </style>
</head>
<body>

    <div id="header">
        <h3 style="margin:0; color: #e50914;">📺 شبکه اختصاصی سریال و انیمیشن</h3>
    </div>

    <div class="player-container">
        <div id="video-slot" style="height: 100%;"></div>
        <div id="info-bar">
            <div id="current-title" class="status-tag">در حال بارگذاری...</div>
        </div>
    </div>

    <script>
        // توجه: این آی‌دی‌ها نمونه هستند. اگر ۴۰۴ داد یعنی این ویدیوها از آپارات پاک شده‌اند.
        const playlist = [
            { id: 'vpe8767', title: 'سریال مسافران - قسمت ۱', duration: 2100 },
            { id: 'm1r2345', title: 'انیمیشن صلح‌بانان - قسمت ۱', duration: 1260 },
            { id: 'a908765', title: 'آنشرلی - قسمت ۱', duration: 1380 }
        ];

        const epochStart = new Date('2025-01-01T00:00:00').getTime() / 1000;

        function sync() {
            const now = Math.floor(Date.now() / 1000);
            const totalDuration = playlist.reduce((a, b) => a + b.duration, 0);
            let elapsed = (now - epochStart) % totalDuration;
            
            let accumulated = 0;
            for (let item of playlist) {
                if (elapsed < accumulated + item.duration) {
                    const seek = Math.floor(elapsed - accumulated);
                    render(item.id, seek, item.title);
                    break;
                }
                accumulated += item.duration;
            }
        }

        function render(id, time, title) {
            const container = document.getElementById('video-slot');
            // آدرس امبد مستقیم آپارات
            const embedUrl = "https://www.aparat.com/video/video/embed/videohash/" + id + "/vt/" + time;
            
            if (container.getAttribute('data-id') !== id) {
                container.innerHTML = '<iframe src="' + embedUrl + '" allowFullScreen="true"></iframe>';
                container.setAttribute('data-id', id);
                document.getElementById('current-title').innerText = "در حال پخش: " + title;
            }
        }

        sync();
        setInterval(sync, 15000);
    </script>
</body>
</html>
