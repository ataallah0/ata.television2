<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تلویزیون مسافران | پخش زنده امن</title>
    <style>
        body { background: #000; color: #fff; margin: 0; font-family: Tahoma; text-align: center; }
        #header { background: #1a1a1a; padding: 15px; border-bottom: 2px solid #e50914; }
        video { width: 100%; height: 75vh; background: #000; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        button { padding: 15px 40px; background: #e50914; color: white; border: none; border-radius: 30px; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1>تلویزیون عطاالله</h1>
        <button onclick="start()">🔴 ورود به پخش زنده</button>
    </div>

    <div id="header"><h3>در حال پخش: سریال مسافران</h3></div>

    <video id="tv" controls playsinline></video>
    <div id="info" style="padding: 20px; color: #f1c40f;">در حال دریافت سیگنال...</div>

    <script>
        const player = document.getElementById('tv');
        
        // لینک‌های مستقیم و دائمی از آرشیو جهانی (بدون فیلتر و مسدودی)
        const playlist = [
            { id: "1", url: "https://archive.org/download/mosaferan-01/Mosaferan-01.mp4", title: "مسافران - قسمت ۱" },
            { id: "2", url: "https://archive.org/download/mosaferan-01/Mosaferan-02.mp4", title: "مسافران - قسمت ۲" }
        ];

        const epochStart = new Date('2025-01-01T00:00:00').getTime() / 1000;
        const duration = 2100; // 35 دقیقه

        function sync() {
            const now = Math.floor(Date.now() / 1000);
            const elapsed = (now - epochStart) % (playlist.length * duration);
            const index = Math.floor(elapsed / duration);
            const seek = elapsed % duration;

            if (player.getAttribute('data-idx') != index) {
                player.src = playlist[index].url;
                player.setAttribute('data-idx', index);
                player.currentTime = seek;
                document.getElementById('info').innerText = "در حال پخش: " + playlist[index].title;
            }
        }

        function start() {
            document.getElementById('overlay').style.display = 'none';
            sync();
            player.play();
            setInterval(sync, 15000);
        }
    </script>
</body>
</html>
