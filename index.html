<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تلویزیون اختصاصی سریال‌های نوستالژیک</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: Tahoma; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .tv-frame { width: 90%; max-width: 950px; aspect-ratio: 16 / 9; background: #000; border: 8px solid #2c3e50; border-radius: 15px; position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.9); }
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .controls { margin-top: 15px; background: #1a1a1a; padding: 15px 25px; border-radius: 12px; display: flex; align-items: center; gap: 20px; border: 1px solid #333; }
        .info-text { min-width: 200px; }
        .series-name { color: #f1c40f; font-weight: bold; font-size: 18px; display: block; }
        .episode-name { color: #bdc3c7; font-size: 14px; }
        button { background: #c0392b; color: white; border: none; padding: 10px 25px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #e74c3c; transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="tv-frame">
        <iframe id="tv-player" src="" allowfullscreen></iframe>
    </div>

    <div class="controls">
        <div class="info-text">
            <span id="display-series" class="series-name">در حال لود...</span>
            <span id="display-episode" class="episode-name">شبکه اختصاصی</span>
        </div>
        <button onclick="nextEpisode()">قسمت بعدی ⏭️</button>
    </div>

    <script>
        const playlist = [
            // سریال مسافران (تست شده)
            { name: "سریال مسافران", ep: "قسمت 1", url: "https://www.namasha.com/embed/mlNwASkS" },
            { name: "سریال مسافران", ep: "قسمت 2", url: "https://www.namasha.com/embed/S26XhW7T" },
            { name: "سریال مسافران", ep: "قسمت 3", url: "https://www.namasha.com/embed/K8N3m1P9" },

            // انیمیشن زنان کوچک (تست شده)
            { name: "انیمیشن زنان کوچک", ep: "قسمت 1", url: "https://www.namasha.com/embed/T6yS2v4k" },
            { name: "انیمیشن زنان کوچک", ep: "قسمت 2", url: "https://www.namasha.com/embed/v/m6Dsh6Pz" },

            // سریال صلح‌بانان
            { name: "صلح‌بانان", ep: "قسمت 1", url: "https://www.namasha.com/embed/O8M7m9H6" },
            { name: "صلح‌بانان", ep: "قسمت 2", url: "https://www.namasha.com/embed/v/S90m7j5K" }
        ];

        let currentPos = parseInt(localStorage.getItem('tv_pos')) || 0;

        function startTV() {
            const currentVideo = playlist[currentPos];
            document.getElementById('tv-player').src = currentVideo.url;
            document.getElementById('display-series').innerText = currentVideo.name;
            document.getElementById('display-episode').innerText = currentVideo.ep;
            localStorage.setItem('tv_pos', currentPos);
        }

        function nextEpisode() {
            currentPos++;
            if (currentPos >= playlist.length) currentPos = 0; // برگشت به اول لیست
            startTV();
        }

        window.onload = startTV;
    </script>
</body>
</html>
